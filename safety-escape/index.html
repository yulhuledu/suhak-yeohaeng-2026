<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b4a6f">
<title>제주 수학여행 안전 대탈출</title>
<style>
  :root{
    --navy:#0b3b5c; --navy2:#0e5a85; --teal:#0e7490; --sky:#e0f2fe; --sky2:#bae6fd;
    --accent:#f59e0b; --accent-d:#b45309; --ok:#16a34a; --ok-bg:#dcfce7; --bad:#dc2626; --bad-bg:#fee2e2;
    --ink:#0f172a; --sub:#64748b; --line:#e2e8f0; --bg:#f1f5f9; --card:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5}
  body{min-height:100vh;min-height:100dvh}
  #app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

  /* HUD */
  #hud{display:none;position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:10px 14px 8px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
  #hud .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  #hud .hearts{font-size:1.05rem;letter-spacing:1px;min-width:92px}
  #hud .score{font-weight:800;font-size:1rem}
  #hud .score small{font-weight:600;opacity:.75;font-size:.68rem;margin-right:4px}
  #hud .combo{font-size:.8rem;font-weight:800;background:rgba(255,255,255,.16);padding:2px 9px;border-radius:12px;min-width:64px;text-align:center}
  #hud .combo.hot{background:var(--accent);color:#3b2300}
  .dots{display:flex;gap:4px;margin-top:7px}
  .dots i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.25)}
  .dots i.on{background:var(--accent)}
  .dots i.cur{background:#fff}

  #screen{flex:1;padding:14px 14px 28px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px;box-shadow:0 1px 3px rgba(15,23,42,.05);margin-bottom:12px}
  h1{font-size:1.5rem;font-weight:900;line-height:1.25;letter-spacing:-.02em}
  h2{font-size:1.2rem;font-weight:800;letter-spacing:-.01em}
  p.sub{color:var(--sub);font-size:.86rem}

  .btn{display:block;width:100%;border:none;border-radius:14px;padding:15px;font-size:1rem;font-weight:800;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--teal),var(--navy2));box-shadow:0 8px 18px rgba(14,116,144,.28);margin-top:12px;font-family:inherit}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.45;box-shadow:none;cursor:not-allowed}
  .btn.ghost{background:#fff;color:var(--navy2);border:1.5px solid var(--sky2);box-shadow:none;padding:11px;font-size:.88rem;font-weight:700}
  .btn.accent{background:linear-gradient(135deg,#f59e0b,#d97706);box-shadow:0 8px 18px rgba(217,119,6,.28)}

  /* intro */
  .hero{background:linear-gradient(160deg,#0b3b5c 0%,#0e7490 60%,#38bdf8 100%);color:#fff;border-radius:22px;padding:26px 20px 22px;text-align:center;margin-bottom:12px;position:relative;overflow:hidden}
  .hero .emojis{font-size:2rem;letter-spacing:4px;margin-bottom:10px}
  .hero p{opacity:.9;font-size:.88rem;margin-top:8px}
  .hero .school{display:inline-block;background:rgba(255,255,255,.18);border-radius:20px;padding:3px 12px;font-size:.74rem;font-weight:700;margin-bottom:10px}
  .rules{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 2px}
  .rule{background:var(--sky);border-radius:12px;padding:9px 10px;font-size:.78rem;color:#075985;font-weight:700}
  .rule b{display:block;font-size:.95rem}
  .fgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
  .f label{display:block;font-size:.72rem;font-weight:800;color:var(--sub);margin-bottom:4px}
  .f input,.f select{width:100%;padding:11px 10px;border:1.5px solid var(--line);border-radius:10px;font-size:.95rem;font-family:inherit;background:#fff;color:var(--ink)}
  .f input:focus,.f select:focus{outline:none;border-color:var(--teal)}
  .f.wide{grid-column:1/-1}
  .err{color:var(--bad);font-size:.8rem;font-weight:700;min-height:1.1em;margin-top:8px}
  .note{font-size:.72rem;color:var(--sub);margin-top:10px;text-align:center}

  /* stage intro */
  .si{text-align:center}
  .si .big{font-size:3.4rem;margin:2px 0 6px}
  .tag{display:inline-block;background:var(--sky);color:#075985;font-weight:800;font-size:.72rem;padding:3px 11px;border-radius:12px;letter-spacing:.04em}
  .si h2{margin:8px 0 8px}
  .story{font-size:.92rem;color:#334155;text-align:left;background:#f8fafc;border-radius:12px;padding:12px 13px;margin-top:6px}
  .mission{margin-top:10px;font-size:.88rem;font-weight:800;color:var(--accent-d);background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:10px 12px;text-align:left}

  /* question */
  .qhead{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;font-weight:800;color:var(--sub);margin-bottom:8px}
  .tm{background:var(--sky);color:#075985;padding:2px 10px;border-radius:12px;font-variant-numeric:tabular-nums}
  .tm.low{background:var(--bad-bg);color:var(--bad)}
  .tbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}
  .tbar i{display:block;height:100%;width:100%;background:var(--teal);transition:width 1s linear}
  .q{font-size:1.02rem;font-weight:700;line-height:1.55;margin:4px 0 12px}
  .scn{font-size:.9rem;color:#334155;background:#f8fafc;border-left:4px solid var(--teal);border-radius:8px;padding:10px 12px;margin-bottom:10px}
  .oxrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .oxbtn{border:2px solid var(--line);background:#fff;border-radius:16px;padding:18px 0;font-size:2.2rem;font-weight:900;cursor:pointer;font-family:inherit}
  .oxbtn.o{color:#2563eb}.oxbtn.x{color:var(--bad)}
  .opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;margin-bottom:8px;font-size:.92rem;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink);line-height:1.45}
  .opt:disabled{cursor:default}
  .opt.right,.oxbtn.right{border-color:var(--ok);background:var(--ok-bg)}
  .opt.wrong,.oxbtn.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .opt.gone{opacity:.35;text-decoration:line-through}
  .glow{animation:glow 1s ease-in-out infinite}
  @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.0)}50%{box-shadow:0 0 0 5px rgba(245,158,11,.45)}}
  .explain{margin-top:10px;border-radius:12px;padding:11px 13px;font-size:.88rem;line-height:1.55}
  .explain.good{background:var(--ok-bg);color:#14532d}
  .explain.bad{background:var(--bad-bg);color:#7f1d1d}
  .explain b{display:block;margin-bottom:2px}
  .hintbox{background:#fffbeb;border:1px dashed #f59e0b;color:#78350f;border-radius:10px;padding:9px 12px;font-size:.84rem;margin-bottom:10px}

  /* scene */
  .scene{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#e0f2fe;touch-action:manipulation}
  .scene svg{display:block;width:100%;height:auto}
  .hs{cursor:pointer}
  .findbar{display:flex;justify-content:space-between;align-items:center;margin:10px 2px 4px;font-size:.82rem;font-weight:800;color:var(--sub)}
  .foundlist{list-style:none;display:flex;flex-direction:column;gap:6px}
  .foundlist li{background:var(--ok-bg);color:#14532d;border-radius:10px;padding:8px 11px;font-size:.82rem;line-height:1.45;animation:pop .35s ease}
  .foundlist li b{display:block}
  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
  @keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}
  .pulse{animation:pulse .7s ease-in-out infinite}

  /* order */
  .steps{display:flex;flex-direction:column;gap:8px}
  .step{display:flex;gap:10px;align-items:flex-start;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px;font-size:.88rem;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink);line-height:1.45}
  .step .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--line);color:var(--sub);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.8rem}
  .step.done{border-color:var(--ok);background:var(--ok-bg)}
  .step.done .n{background:var(--ok);color:#fff}
  .step.shake{animation:shake .35s}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .pbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:2px 0 12px}
  .pbar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}

  /* clear / result */
  .clear{text-align:center}
  .badge{font-size:4rem;animation:pop .5s ease}
  .sum{text-align:left;margin-top:10px;background:#f8fafc;border-radius:12px;padding:11px 13px;font-size:.86rem}
  .sum li{margin:4px 0 4px 16px}
  .gain{display:inline-block;margin-top:8px;background:#fffbeb;color:var(--accent-d);font-weight:800;border-radius:12px;padding:4px 12px;font-size:.85rem}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
  .stat{background:var(--sky);border-radius:12px;padding:10px;text-align:center}
  .stat b{display:block;font-size:1.3rem;color:var(--navy)}
  .stat span{font-size:.72rem;color:#075985;font-weight:700}
  .badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}
  .badges span{background:#fffbeb;border:1px solid #fde68a;border-radius:20px;padding:3px 10px;font-size:.78rem;font-weight:700;color:var(--accent-d)}
  canvas#cert{width:100%;height:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px;background:#fff}
  .send{font-size:.8rem;font-weight:700;margin-top:8px;text-align:center}

  /* overlay */
  #overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  #overlay .box{background:#fff;border-radius:18px;padding:22px 18px 16px;max-width:380px;width:100%;text-align:center}
  #overlay .box .em{font-size:2.6rem}
  #overlay .box h3{margin:6px 0 6px;font-size:1.1rem}
  #overlay .box p{font-size:.88rem;color:#334155}
  #toast{position:fixed;left:50%;top:84px;transform:translateX(-50%) translateY(-12px);background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;font-size:.84rem;font-weight:700;opacity:0;pointer-events:none;transition:all .25s;z-index:60;max-width:90%;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.on-intro{top:20px}
  .flash{animation:flash .45s}
  @keyframes flash{0%{box-shadow:inset 0 0 0 100vmax rgba(220,38,38,.28)}100%{box-shadow:inset 0 0 0 100vmax rgba(220,38,38,0)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="row">
      <div class="hearts" id="hHearts"></div>
      <div class="combo" id="hCombo">COMBO 0</div>
      <div class="score"><small>SCORE</small><span id="hScore">0</span></div>
    </div>
    <div class="dots" id="hDots"></div>
  </div>
  <div id="screen"></div>
</div>
<div id="overlay"><div class="box" id="overlayBox"></div></div>
<div id="toast"></div>

<script>
// ★★★ EscapeScore.gs 를 배포해서 나온 /exec 주소를 아래 따옴표 안에 붙여넣으세요. ★★★
// 비워두면 "연습 모드"로 동작하고, 점수는 선생님께 전달되지 않습니다.
const SCORE_API_URL = "https://script.google.com/macros/s/AKfycbwOEmSz8lR0W7CY6-dses4fyWApDVPXwIx6_d2QM1-oehbX0HHywLXeyAOSb08ZK3rc/exec";

/* ═════════════════════ 게임 데이터 ═════════════════════ */
// 안전 수칙은 일반적인 안전 원칙 + 공개된 이용 기준을 바탕으로 했습니다.
// 시설별 세부 규정(키·나이 기준, 보호장비 등)은 현장 안내와 인솔교사 지시가 항상 우선입니다.

const TOTAL_STAGES = 8;

const STAGES = [
  { id:'S1', icon:'🚌', name:'출발! 이동 중 안전', badge:'안전벨트 배지', type:'ox', perQ:15,
    story:'제주행 길, 버스와 공항 이동이 이어져요. 사고는 대개 "잠깐인데 뭐 어때" 하는 순간에 일어나요.',
    mission:'O/X로 판단하세요. 문제당 15초! 틀리면 하트가 줄어요.',
    summary:['달리는 버스에서는 자리에서 일어나지 않기','고속도로에서는 버스 모든 좌석에서도 안전띠 착용','비상구·통로는 짐으로 막지 않기, 비상구 위치는 미리 확인'],
    qs:[
      { id:'S1-Q1', q:'버스가 달리는 중에 짐을 꺼내거나 사진을 찍으려고 5초만 일어서는 건 괜찮다.', a:false,
        hint:'급브레이크는 예고 없이 걸려요. 5초 사이에도요.',
        why:'급제동 순간 몸이 앞으로 튕겨 나가 크게 다칠 수 있어요. 짐은 정차한 뒤에 꺼내요.' },
      { id:'S1-Q2', q:'고속도로를 달리는 버스에서는 모든 좌석에서 안전띠를 매야 한다.', a:true,
        hint:'"뒷자리·창가 자리라서 괜찮다"는 생각이 가장 위험해요.',
        why:'고속도로·자동차전용도로에서는 버스도 전 좌석 안전띠 착용이 의무예요. 안전띠를 맨 사람과 안 맨 사람의 사고 피해는 크게 달라요.' },
      { id:'S1-Q3', q:'버스를 타면 비상구 위치와 비상망치 위치를 먼저 확인해 두는 게 좋다.', a:true,
        hint:'사고 때 연기·정전이 오면 처음 보는 장소는 못 찾아요.',
        why:'사고 직후에는 당황해서 판단이 늦어져요. 미리 알아둔 비상구 위치가 탈출 시간을 줄여줘요.' },
      { id:'S1-Q4', q:'큰 캐리어는 통로나 비상구 앞에 두는 게 가장 편하다.', a:false,
        hint:'편한 것과 안전한 것은 달라요.',
        why:'통로와 비상구가 막히면 비상시 탈출이 불가능해요. 짐은 짐칸이나 좌석 아래, 지정 위치에 둬요.' }
    ]},

  { id:'S2', icon:'⛵', name:'샹그릴라 요트 체험', badge:'구명조끼 배지', type:'hidden', time:90, scene:'yacht',
    story:'요트가 항구를 벗어나 바다로 나왔어요. 신나는 마음에 몇몇 친구가 위험한 행동을 하고 있어요!',
    mission:'갑판 그림에서 위험하게 행동하는 친구 4명을 찾아 누르세요. 안전한 사람을 누르면 하트가 줄어요.',
    prompt:'갑판 위에서 위험하게 행동하는 친구 4명을 찾아보세요.',
    summary:['구명조끼는 수영을 잘해도 승선하는 동안 계속 착용','난간에 앉거나 몸을 내밀지 않기 — 흔들림 한 번이면 바다로 떨어짐','뱃머리 끝, 젖은 갑판에서는 뛰지 않기','선원의 안내에 따라 지정된 곳에서만 움직이기']},

  { id:'S3', icon:'🏎️', name:'9.81파크 레이싱 체험', badge:'규정 준수 배지', type:'choice',
    story:'"중력 가속도 9.81"에서 이름을 딴 무동력 레이싱 체험! 속도가 붙으면 작은 실수가 큰 사고가 돼요.',
    mission:'상황을 읽고 가장 안전한 행동을 고르세요. 시설별 기준은 현장 안내를 따르는 게 원칙이에요.',
    summary:['탑승 기준(나이·키)은 그 차량의 안전장치가 맞게 설계된 범위 — 몰래 어기지 않기','앞차와는 항상 안전거리 유지, 추월·밀기 금지','사고가 나도 직원 신호 전에는 임의로 내리지 않기'],
    qs:[
      { id:'S3-Q1', scn:'친구가 "나 키가 딱 1cm 모자란데, 신발 안에 깔창 넣고 타면 되겠지?" 하며 탑승하려고 해요. (예: 1인승 차량은 만 14세 이상, 신장 150~190cm 기준으로 안내되는 경우가 있어요)',
        q:'나의 가장 좋은 행동은?',
        opts:['웃으면서 응원한다. 한 번쯤은 괜찮다.','기준은 안전장치에 맞춘 거라고 설명하고, 직원에게 탈 수 있는 다른 차량이나 체험을 물어보자고 한다.','직원이 안 볼 때 슬쩍 타라고 알려준다.','나도 같이 깔창을 넣는다.'],
        ans:1, hint:'기준에는 이유가 있어요. 몸에 안 맞는 안전벨트는 제 기능을 못해요.',
        why:'차량의 안전벨트·보호 구조는 정해진 체형 범위에 맞춰 설계돼요. 기준 미달로 타면 사고 때 벨트가 몸을 못 잡아줄 수 있어요. 직원에게 문의해 가능한 체험을 찾는 게 정답이에요.' },
      { id:'S3-Q2', scn:'내 앞 차가 느리게 가요. 답답해서 속도를 더 내 추월하고 싶은 마음이 들어요.',
        q:'어떻게 해야 할까요?',
        opts:['앞차를 슬쩍 밀면서 비켜 달라고 한다.','코너에서 확 가속해서 추월한다.','안전거리를 유지하고, 안내된 규정과 직원 신호에 따라 주행한다.','내 헬멧만 쓰고 있으면 부딪혀도 괜찮다.'],
        ans:2, hint:'"속도 경쟁"이 아니라 "안전하게 타는 체험"이에요.',

/* ═════════════════════ 상태 · 유틸 ═════════════════════ */
const $ = function(s){ return document.querySelector(s); };
const G = { score:0, hearts:5, combo:0, maxCombo:0, hints:0, badges:[], wrong:[], start:0, idx:0, timer:null, sent:false, player:null };

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function setScreen(html){ $('#screen').innerHTML = html; window.scrollTo(0, 0); }
function clearTimer(){ if (G.timer){ clearInterval(G.timer); G.timer = null; } }
function vibrate(ms){ try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){} }
let toastT = null;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('show'); }, 2200); }
function modal(html, onClose){
  const o = $('#overlay'); $('#overlayBox').innerHTML = html; o.style.display = 'flex';
  const b = $('#overlayBox').querySelector('button');
  if (b) b.onclick = function(){ o.style.display = 'none'; if (onClose) onClose(); };
}

function updateHud(){
  let h = ''; for (let i = 0; i < 5; i++) h += (i < G.hearts ? '❤️' : '🖤');
  $('#hHearts').textContent = ''; $('#hHearts').innerHTML = h;
  $('#hScore').textContent = G.score;
  const c = $('#hCombo'); c.textContent = 'COMBO ' + G.combo; c.className = 'combo' + (G.combo >= 3 ? ' hot' : '');
  let d = ''; for (let i = 0; i < TOTAL_STAGES; i++) d += '<i class="' + (i < G.badges.length ? 'on' : (i === G.idx ? 'cur' : '')) + '"></i>';
  $('#hDots').innerHTML = d;
}
function addScore(n){ G.score = Math.max(0, G.score + n); updateHud(); }
function comboBonus(){ return Math.min(G.combo, 5) * 10; }

function logWrong(id, stageName, q){ G.wrong.push({ id:id, stage:stageName, q:String(q).slice(0, 120) }); }

// 하트 감소. 하트가 0이 되면 true(게임오버 처리됨)
function loseHeart(){
  G.hearts = Math.max(0, G.hearts - 1); G.combo = 0; updateHud(); vibrate(120);
  document.body.classList.remove('flash'); void document.body.offsetWidth; document.body.classList.add('flash');
  if (G.hearts <= 0){ gameOver(); return true; }
  return false;
}
function gameOver(){
  clearTimer();

function startGame(player){
  Object.assign(G, { score:0, hearts:5, combo:0, maxCombo:0, hints:0, badges:[], wrong:[], start:Date.now(), idx:0, sent:false, player:player });
  $('#hud').style.display = 'block';
  runStage(0);
}

/* ═════════════════════ 스테이지 공통 ═════════════════════ */
function runStage(i){
  clearTimer(); G.idx = i; updateHud();
  const st = STAGES[i];
  const tag = st.type === 'final' ? 'FINAL' : 'STAGE ' + (i + 1) + ' / ' + TOTAL_STAGES;
  setScreen('<div class="card si"><div class="big">' + st.icon + '</div><span class="tag">' + tag + '</span><h2>' + st.name + '</h2>' +
    '<div class="story">' + st.story + '</div><div class="mission">🎯 ' + st.mission + '</div>' +
    '<button class="btn" id="goBtn">도전 시작</button></div>');
  $('#goBtn').onclick = function(){ playStage(i); };
}
function playStage(i){
  clearTimer(); G.idx = i; updateHud();
  const st = STAGES[i];
  if (st.type === 'ox') playOX(st, i);
  else if (st.type === 'choice') playChoice(st, i);
  else if (st.type === 'hidden') playHidden(st, i);
  else if (st.type === 'order') playOrder(st, i);
  else playFinal(st, i);
}
function stageClear(i, bonus){
  clearTimer();
  const st = STAGES[i];
  if (G.badges.indexOf(st.id) === -1) G.badges.push(st.id);
  updateHud();
  const sum = st.summary.map(function(s){ return '<li>' + s + '</li>'; }).join('');
  setScreen('<div class="card clear"><div class="badge">' + st.icon + '</div><span class="tag">' + st.badge + ' 획득!</span>' +
    '<h2 style="margin-top:8px">' + st.name + ' 클리어</h2>' + (bonus ? '<div class="gain">⏱ 시간 보너스 +' + bonus + '</div>' : '') +
    '<div class="sum"><b>오늘 기억할 안전 포인트</b><ul>' + sum + '</ul></div>' +
    '<button class="btn" id="nextBtn">' + (i === TOTAL_STAGES - 1 ? '마지막 문으로 ▶' : '다음 장소로 ▶') + '</button></div>');
  $('#nextBtn').onclick = function(){ runStage(i + 1); };
}

/* ═════════════════════ O / X ═════════════════════ */
function playOX(st, i){
  const qs = shuffle(st.qs); let qi = 0, hintShown = false;
  function render(){
    const q = qs[qi]; hintShown = false; let left = st.perQ; let answered = false;
    setScreen('<div class="card"><div class="qhead"><span>' + st.icon + ' ' + st.name + ' · ' + (qi + 1) + '/' + qs.length + '</span><span class="tm" id="tm">⏱ ' + left + '</span></div>' +
      '<div class="tbar"><i id="tb"></i></div><div id="hintArea"></div><p class="q">' + q.q + '</p>' +
      '<div class="oxrow"><button class="oxbtn o" id="bo">O</button><button class="oxbtn x" id="bx">X</button></div>' +
      '<div id="result"></div><button class="btn ghost" id="hint">💡 힌트 (-30점, -10초)</button></div>');
    requestAnimationFrame(function(){ const tb = $('#tb'); if (tb) tb.style.width = '0%'; });
    const tb = $('#tb'); tb.style.transition = 'width ' + left + 's linear';
    function finish(choice, timedOut){
      if (answered) return; answered = true; clearTimer();
      const ok = (choice === q.a); const bo = $('#bo'), bx = $('#bx'); bo.disabled = bx.disabled = true; $('#hint').style.display = 'none';
      (q.a ? bo : bx).classList.add('right');
      let dead = false, gain = 0;
      if (ok){ G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo); gain = 100 + comboBonus() + Math.max(0, left) * 2; addScore(gain); }
      else { (choice === true ? bo : bx).classList.add('wrong'); logWrong(q.id, st.name, q.q); dead = loseHeart(); }
      if (dead) return;
      $('#result').innerHTML = '<div class="explain ' + (ok ? 'good' : 'bad') + '"><b>' + (ok ? '정답! +' + gain : (timedOut ? '시간 초과!' : '아쉬워요!') + ' 하트 -1') + '</b>' + q.why + '</div>' +
        '<button class="btn" id="nx">' + (qi === qs.length - 1 ? '결과 보기' : '다음 문제') + '</button>';
      $('#nx').onclick = function(){ qi++; if (qi >= qs.length) stageClear(i, 0); else render(); };
    }
    $('#bo').onclick = function(){ finish(true); };
    $('#bx').onclick = function(){ finish(false); };
    $('#hint').onclick = function(){
      if (hintShown || answered) return; hintShown = true; useHint(); left = Math.max(1, left - 10);
      $('#hintArea').innerHTML = '<div class="hintbox">💡 ' + q.hint + '</div>'; $('#hint').disabled = true;
    };
    G.timer = setInterval(function(){
      left--; const tm = $('#tm'); if (tm){ tm.textContent = '⏱ ' + Math.max(0, left); tm.className = 'tm' + (left <= 5 ? ' low' : ''); }
      if (left <= 0) finish(!q.a, true);
    }, 1000);
  }
  render();
}

/* ═════════════════════ 상황 선택형 ═════════════════════ */
function playChoice(st, i){
  const qs = st.qs; let qi = 0;
  function render(){
    const q = qs[qi]; let hinted = false, answered = false;
    const order = shuffle(q.opts.map(function(t, k){ return { t:t, ok:(k === q.ans) }; }));
    setScreen('<div class="card"><div class="qhead"><span>' + st.icon + ' ' + st.name + ' · ' + (qi + 1) + '/' + qs.length + '</span></div>' +
      '<div class="scn">' + q.scn + '</div><p class="q">' + q.q + '</p><div id="hintArea"></div><div id="opts"></div><div id="result"></div>' +
      '<button class="btn ghost" id="hint">💡 힌트 (-30점) — 오답 하나 지우기</button></div>');
    const box = $('#opts');
    order.forEach(function(o, k){
      const b = document.createElement('button'); b.className = 'opt'; b.textContent = o.t; b.dataset.k = k;
      b.onclick = function(){ pick(k); }; box.appendChild(b);
    });
    function pick(k){
      if (answered) return; answered = true;
      const btns = box.querySelectorAll('.opt'); btns.forEach(function(b){ b.disabled = true; });
      $('#hint').style.display = 'none';
      const ok = order[k].ok; let dead = false, gain = 0;
      order.forEach(function(o, n){ if (o.ok) btns[n].classList.add('right'); });
      if (ok){ G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo); gain = 100 + comboBonus(); addScore(gain); }
      else { btns[k].classList.add('wrong'); logWrong(q.id, st.name, q.scn.slice(0, 40) + ' / ' + q.q); dead = loseHeart(); }
      if (dead) return;
      $('#result').innerHTML = '<div class="explain ' + (ok ? 'good' : 'bad') + '"><b>' + (ok ? '정답! +' + gain : '아쉬워요! 하트 -1') + '</b>' + q.why + '</div>' +
        '<button class="btn" id="nx">' + (qi === qs.length - 1 ? '결과 보기' : '다음 문제') + '</button>';
      $('#nx').onclick = function(){ qi++; if (qi >= qs.length) stageClear(i, 0); else render(); };
    }
    $('#hint').onclick = function(){
      if (hinted || answered) return; hinted = true; useHint();
      const wrongIdx = []; order.forEach(function(o, n){ if (!o.ok) wrongIdx.push(n); });
      const kill = wrongIdx[Math.floor(Math.random() * wrongIdx.length)];
      const b = box.querySelectorAll('.opt')[kill]; b.classList.add('gone'); b.disabled = true;
      $('#hintArea').innerHTML = '<div class="hintbox">💡 ' + q.hint + '</div>'; $('#hint').disabled = true;
    };
  }
  render();
}

/* ═════════════════════ 순서 맞추기 ═════════════════════ */
function playOrder(st, i){
  let pi = 0;
  function render(){
    const part = st.parts[pi]; let next = 0, done = false;
    const cards = shuffle(part.steps.map(function(t, k){ return { t:t, k:k }; }));
    setScreen('<div class="card"><div class="qhead"><span>' + st.icon + ' ' + st.name + ' · ' + (pi + 1) + '/' + st.parts.length + '</span></div>' +
      '<p class="q">' + part.title + '</p><div class="pbar"><i id="pb"></i></div><div class="steps" id="steps"></div><div id="result"></div>' +
      '<button class="btn ghost" id="hint">💡 힌트 (-30점) — 다음 순서 알려주기</button></div>');
    const box = $('#steps');
    cards.forEach(function(c){
      const b = document.createElement('button'); b.className = 'step'; b.innerHTML = '<span class="n">·</span><span></span>';
      b.lastChild.textContent = c.t; b.dataset.k = c.k;
      b.onclick = function(){
        if (done || b.classList.contains('done')) return;
        if (c.k === next){
          next++; b.classList.add('done'); b.firstChild.textContent = next; b.classList.remove('glow');
          G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo); addScore(50);
          $('#pb').style.width = (next / part.steps.length * 100) + '%';
          box.querySelectorAll('.step').forEach(function(s){ s.style.outline = ''; });
          if (next === part.steps.length){
            done = true; addScore(100); $('#hint').style.display = 'none';
            $('#result').innerHTML = '<div class="explain good"><b>순서 완성! +100</b>' + part.why + '</div>' +
              '<button class="btn" id="nx">' + (pi === st.parts.length - 1 ? '결과 보기' : '다음 순서 ▶') + '</button>';
            $('#nx').onclick = function(){ pi++; if (pi >= st.parts.length) stageClear(i, 0); else render(); };
          }
        } else {
          b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
          logWrong(part.id, st.name, part.title + ' (' + (next + 1) + '번째 순서 오답)');
          if (loseHeart()) return;
          toast('순서가 달라요! 하트 -1');
        }
      };
      box.appendChild(b);
    });
    $('#hint').onclick = function(){
      if (done) return; useHint();
      box.querySelectorAll('.step').forEach(function(s){ if (+s.dataset.k === next) s.classList.add('glow'); });
      toast('💡 다음 순서 카드가 깜빡여요 (-30점)');
    };
  }
  render();
}

/* ═════════════════════ 위험 찾기 (숨은 그림) ═════════════════════ */
function person(x, y, o){
  o = o || {}; const sk = '#fcd5b0', sh = o.shirt || '#60a5fa', pn = o.pants || '#334155', hair = o.hair || '#1f2937'; let s = '';
  const pose = o.pose || 'stand';
  if (pose === 'sit'){
    s += '<rect x="' + (x - 7) + '" y="' + (y - 32) + '" width="14" height="22" rx="5" fill="' + sh + '"/>';
    s += '<circle cx="' + x + '" cy="' + (y - 40) + '" r="7" fill="' + sk + '"/><path d="M' + (x - 7) + ' ' + (y - 41) + 'a7 7 0 0 1 14 0z" fill="' + hair + '"/>';
    s += '<rect x="' + (x - 6) + '" y="' + (y - 12) + '" width="22" height="7" rx="3" fill="' + pn + '"/><rect x="' + (x + 10) + '" y="' + (y - 12) + '" width="7" height="16" rx="3" fill="' + pn + '"/>';
    if (o.vest) s += '<rect x="' + (x - 7) + '" y="' + (y - 30) + '" width="14" height="16" rx="4" fill="#f97316"/><rect x="' + (x - 1) + '" y="' + (y - 30) + '" width="2" height="16" fill="#fff"/>';
    if (o.arms === 'forward') s += '<line x1="' + x + '" y1="' + (y - 26) + '" x2="' + (x + 18) + '" y2="' + (y - 24) + '" stroke="' + sk + '" stroke-width="4" stroke-linecap="round"/>';
    return s;
  }
  const dy = o.jump ? -8 : 0; y += dy;
  s += '<rect x="' + (x - 6) + '" y="' + (y - 14) + '" width="5" height="' + (14 - dy) + '" rx="2" fill="' + pn + '"/><rect x="' + (x + 1) + '" y="' + (y - 14) + '" width="5" height="' + (14 - dy) + '" rx="2" fill="' + pn + '"/>';
  s += '<rect x="' + (x - 8) + '" y="' + (y - 38) + '" width="16" height="25" rx="6" fill="' + sh + '"/>';
  if (o.vest) s += '<rect x="' + (x - 8) + '" y="' + (y - 36) + '" width="16" height="20" rx="5" fill="#f97316"/><rect x="' + (x - 1) + '" y="' + (y - 36) + '" width="2" height="20" fill="#fff"/>';
  s += '<circle cx="' + x + '" cy="' + (y - 46) + '" r="7.5" fill="' + sk + '"/><path d="M' + (x - 7.5) + ' ' + (y - 47) + 'a7.5 7.5 0 0 1 15 0z" fill="' + hair + '"/>';
  if (o.cap) s += '<rect x="' + (x - 9) + '" y="' + (y - 56) + '" width="18" height="6" rx="3" fill="#0f172a"/>';
  const a = o.arms || 'down';
  if (a === 'out') s += '<line x1="' + (x - 8) + '" y1="' + (y - 33) + '" x2="' + (x - 26) + '" y2="' + (y - 36) + '" stroke="' + sk + '" stroke-width="4" stroke-linecap="round"/><line x1="' + (x + 8) + '" y1="' + (y - 33) + '" x2="' + (x + 26) + '" y2="' + (y - 36) + '" stroke="' + sk + '" stroke-width="4" stroke-linecap="round"/>';
  else if (a === 'phone') s += '<line x1="' + (x + 8) + '" y1="' + (y - 33) + '" x2="' + (x + 20) + '" y2="' + (y - 50) + '" stroke="' + sk + '" stroke-width="4" stroke-linecap="round"/><rect x="' + (x + 17) + '" y="' + (y - 62) + '" width="8" height="13" rx="2" fill="#0f172a"/>';
  else if (a === 'point') s += '<line x1="' + (x + 8) + '" y1="' + (y - 33) + '" x2="' + (x + 24) + '" y2="' + (y - 38) + '" stroke="' + sk + '" stroke-width="4" stroke-linecap="round"/>';
  else s += '<line x1="' + (x - 8) + '" y1="' + (y - 32) + '" x2="' + (x - 11) + '" y2="' + (y - 20) + '" stroke="' + sk + '" stroke-width="4" stroke-linecap="round"/><line x1="' + (x + 8) + '" y1="' + (y - 32) + '" x2="' + (x + 11) + '" y2="' + (y - 20) + '" stroke="' + sk + '" stroke-width="4" stroke-linecap="round"/>';
  return s;
}
function hs(i, x, y, w, h, inner){
  return '<g class="hs" data-i="' + i + '">' + inner + '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="#fff" fill-opacity="0.001"/></g>';
}

function playHidden(st, i){
  const sc = SCENES[st.scene](); const items = sc.items;
  const need = items.filter(function(x){ return x.risk; }).length; let found = 0, left = st.time, done = false;
  setScreen('<div class="card"><div class="qhead"><span>' + st.icon + ' ' + st.name + '</span><span class="tm" id="tm">⏱ ' + left + '</span></div>' +
    '<div class="tbar"><i id="tb"></i></div><p class="q" style="margin-top:0">' + st.prompt + '</p><div class="scene" id="scene">' + sc.svg + '</div>' +
    '<div class="findbar"><span>찾은 위험</span><span id="fc">0 / ' + need + '</span></div><ul class="foundlist" id="foundList"></ul>' +
    '<button class="btn ghost" id="hint">💡 힌트 (-30점, -10초)</button></div>');
  const svg = $('#scene svg'); const NS = 'http://www.w3.org/2000/svg';
  const tb = $('#tb'); tb.style.transition = 'none'; tb.style.width = '100%';
  function mark(it, color, label, keep){
    const r = document.createElementNS(NS, 'rect');
    const x = it.x, y = it.y, w = it.w, h = it.h;
    r.setAttribute('x', x); r.setAttribute('y', y); r.setAttribute('width', w); r.setAttribute('height', h); r.setAttribute('rx', 8);
    r.setAttribute('fill', 'none'); r.setAttribute('stroke', color); r.setAttribute('stroke-width', 3); r.setAttribute('pointer-events', 'none');
    svg.appendChild(r);
    let t = null;
    if (label){ t = document.createElementNS(NS, 'text'); t.setAttribute('x', x + w / 2); t.setAttribute('y', Math.max(12, y - 4)); t.setAttribute('text-anchor', 'middle');
      t.setAttribute('font-size', 11); t.setAttribute('font-weight', 800); t.setAttribute('fill', color); t.setAttribute('stroke', '#fff'); t.setAttribute('stroke-width', 3); t.setAttribute('paint-order', 'stroke');
      t.setAttribute('pointer-events', 'none'); t.textContent = label; svg.appendChild(t); }
    if (!keep) setTimeout(function(){ r.remove(); if (t) t.remove(); }, 1100);
    return r;
  }
  function win(){
    done = true; clearTimer();
    const bonus = Math.max(0, left) * 2; addScore(bonus);
    setTimeout(function(){ stageClear(i, bonus); }, 900);
  }
  svg.addEventListener('click', function(ev){
    if (done) return;
    const g = ev.target.closest ? ev.target.closest('.hs') : null; if (!g) return;
    const k = +g.dataset.i; const it = items[k]; if (it.done) return;
    it.done = true;
    if (it.risk){
      found++; G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo); const gain = 100 + comboBonus(); addScore(gain);
      mark(it, '#16a34a', '✓', true);
      const li = document.createElement('li'); li.innerHTML = '<b>✔ ' + it.label + ' (+' + gain + ')</b>' + it.why; $('#foundList').appendChild(li);
      $('#fc').textContent = found + ' / ' + need;
      if (found === need) win();
    } else {
      mark(it, '#dc2626', '안전해요', false); logWrong(st.id + '-DECOY' + k, st.name, '안전한 대상을 위험으로 선택: ' + it.why.slice(0, 40));
      toast(it.why);
      if (loseHeart()) return;
    }
  });
  // 간격 위험(레일바이크)은 눈에 띄는 화살표로 위치를 암시하지 않고, 힌트에서만 보여줍니다.
  $('#hint').onclick = function(){
    if (done) return;
    const rest = items.filter(function(x){ return x.risk && !x.done; }); if (!rest.length) return;
    useHint(); left = Math.max(1, left - 10);
    const it = rest[Math.floor(Math.random() * rest.length)];
    const r = mark(it, '#f59e0b', '여기를 보세요', false); r.setAttribute('class', 'pulse');
    toast('💡 위험 요소 하나의 위치를 알려줬어요 (-30점, -10초)');
  };
  function tick(){
    left--; const tm = $('#tm'); if (tm){ tm.textContent = '⏱ ' + Math.max(0, left); tm.className = 'tm' + (left <= 10 ? ' low' : ''); }
    tb.style.transition = 'width 1s linear'; tb.style.width = Math.max(0, left / st.time * 100) + '%';
    if (left <= 0){
      clearTimer(); toast('시간 초과! 하트 -1, 30초를 더 드려요');
      if (loseHeart()) return;
      left = 30; G.timer = setInterval(tick, 1000);
    }
  }
  G.timer = setInterval(tick, 1000);
}

function playFinal(st, i){
  function round(){
    const qs = shuffle(st.qs); let qi = 0, wrongCount = 0;
    function render(){
      const q = qs[qi];
      setScreen('<div class="card"><div class="qhead"><span>' + st.icon + ' 마지막 문 · ' + (qi + 1) + '/' + qs.length + '</span><span class="tm">하트 감소 없음</span></div>' +
        '<p class="q">' + q.q + '</p><div class="oxrow"><button class="oxbtn o" id="bo">O</button><button class="oxbtn x" id="bx">X</button></div><div id="result"></div></div>');
      function pick(c){
        const bo = $('#bo'), bx = $('#bx'); bo.disabled = bx.disabled = true; (q.a ? bo : bx).classList.add('right');
        const ok = (c === q.a);
        if (ok){ G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo); addScore(60); } else { (c ? bo : bx).classList.add('wrong'); wrongCount++; G.combo = 0; updateHud(); logWrong(q.id, st.name, q.q); }
        $('#result').innerHTML = '<div class="explain ' + (ok ? 'good' : 'bad') + '"><b>' + (ok ? '정답!' : '아쉬워요!') + '</b>' + q.why + '</div><button class="btn" id="nx">' + (qi === qs.length - 1 ? '문 열어보기' : '다음 문제') + '</button>';
        $('#nx').onclick = function(){ qi++; if (qi < qs.length) render(); else end(); };
      }
      $('#bo').onclick = function(){ pick(true); }; $('#bx').onclick = function(){ pick(false); };
    }
    function end(){
      if (wrongCount === 0){ if (G.badges.indexOf('FINAL') === -1) G.badges.push('FINAL'); updateHud(); showResult(); }
      else setScreen('<div class="card clear"><div class="badge">🔒</div><h2>문이 아직 안 열렸어요</h2><p class="sub" style="margin-top:6px">' + wrongCount + '문제를 틀렸어요. 해설을 떠올리며 다시 도전해요!<br>(하트·점수 감소 없음)</p><button class="btn accent" id="rt">다시 도전</button></div>');
      if (wrongCount !== 0) $('#rt').onclick = round;
    }
    render();
  }
  round();
}

function sendResult(secs){
  const msg = $('#sendMsg');
  if (!SCORE_API_URL){ msg.style.color = 'var(--sub)'; msg.textContent = '연습 모드: 점수는 선생님께 전달되지 않아요.'; return; }
  if (G.sent){ msg.style.color = 'var(--ok)'; msg.textContent = '✅ 이미 선생님께 전달됐어요.'; return; }
  const p = G.player;
  const body = JSON.stringify({ type:'result', grade:p.grade, cls:p.cls, num:p.num, name:p.name, score:G.score, maxCombo:G.maxCombo, hearts:G.hearts, hints:G.hints, seconds:secs, badges:G.badges.length, wrong:G.wrong });
  // Content-Type을 지정하지 않아 text/plain으로 전송 → CORS 프리플라이트를 피합니다.
  fetch(SCORE_API_URL, { method:'POST', body:body }).then(function(r){ return r.json(); }).then(function(j){
    if (j && j.ok){ G.sent = true; msg.style.color = 'var(--ok)'; msg.textContent = '✅ 결과가 선생님께 전달됐어요.'; }
    else throw new Error('server');
  }).catch(function(){
    msg.style.color = 'var(--bad)'; msg.innerHTML = '⚠️ 전송에 실패했어요. <a href="#" id="retry">다시 전송</a>';
    const r = $('#retry'); if (r) r.onclick = function(e){ e.preventDefault(); msg.style.color = 'var(--sub)'; msg.textContent = '다시 전송하는 중…'; sendResult(secs); };
  });
}

  c.fillText('우리 반 안전 지킴이로 인정합니다.', W / 2, 466);

  const d = new Date(); c.font = '600 20px ' + F; c.fillStyle = '#64748b'; c.fillText(d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일', W / 2, 566);
  c.font = '64px sans-serif'; c.fillText('🏅', 120, 130); c.fillText('🏅', W - 120, 130);
}
